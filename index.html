<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080D1A">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Gym Log Pro</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <div class="app">
    <div class="top">
      <div class="brand">Gym Log <span class="brand-badge">PRO</span></div>
      <div class="top-r">
        <div class="status" id="status">Ready</div>
        <button class="icon-btn" id="theme-btn" title="Toggle Dark/Light Mode">◐</button>
      </div>
    </div>
    <main class="view" id="view"></main>
  </div>

  <!-- Rest Timer -->
  <div class="rest" id="rest" hidden>
    <div class="rtxt"><small id="rlabel">Rest</small><b id="rtime">1:30</b></div>
    <button class="rbtn" id="r-15">-15s</button>
    <button class="rbtn" id="r+15">+15s</button>
    <button class="rbtn" id="rskip">Skip</button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Universal Modal -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Workout details" hidden>
    <div class="mbox" id="mbox"></div>
  </div>

  <nav class="bar" role="tablist">
    <button class="nb" role="tab" id="t-train" aria-selected="true"><span class="gl"><svg viewBox="0 0 24 24">
          <path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12" />
        </svg></span>Train</button>
    <button class="nb" role="tab" id="t-body" aria-selected="false"><span class="gl"><svg viewBox="0 0 24 24">
          <circle cx="12" cy="5.5" r="2.3" />
          <path d="M12 8.5v6M7.5 11.5h9M9 21l3-6.5L15 21" />
        </svg></span>Body</button>
    <button class="nb" role="tab" id="t-meals" aria-selected="false"><span class="gl"><svg viewBox="0 0 24 24">
          <path d="M7 3v7M5 3v4.5a2 2 0 004 0V3M7 10v11M17 3c-2.2 1.8-3 4.6-3 7.5h3V21" />
        </svg></span>Meals</button>
    <button class="nb" role="tab" id="t-plan" aria-selected="false"><span class="gl"><svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" />
          <circle cx="12" cy="12" r="4.2" />
          <circle cx="12" cy="12" r=".6" />
        </svg></span>Plan</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/train.js"></script>
  <script src="js/muscles.js"></script>
  <script src="js/body.js"></script>
  <script src="js/meals.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
