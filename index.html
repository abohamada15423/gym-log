<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080D1A">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Gym Log Pro</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    :root {
      --bg: #EDF1F6;
      --surface: #FFFFFF;
      --surface-2: #F5F8FC;
      --ink: #0D1626;
      --muted: #5E6B80;
      --line: #DFE5ED;
      --accent: #2F5BFF;
      --accent-d: #13287A;
      --accent-ink: #FFFFFF;
      --soft: #E5EBFF;
      --gold: #F5A400;
      --gold-soft: #FFF5DC;
      --ok: #10B981;
      --ok-soft: #D1FAE5;
      --warn: #F2620A;
      --sil: #E6EBF3;
      --m0: #C9D2E0;
      --m1: #9DB4FF;
      --m2: #5E82FF;
      --m3: #1A3FD0;
      --m4: #F5A400;
      --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
      --f-body: "Barlow", system-ui, -apple-system, sans-serif;
      --f-data: "IBM Plex Mono", ui-monospace, monospace;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #080D1A;
        --surface: #11192B;
        --surface-2: #17223B;
        --ink: #EAF0FA;
        --muted: #8C9AB3;
        --line: #222F49;
        --accent: #5B80FF;
        --accent-d: #1B2F7A;
        --accent-ink: #080D1A;
        --soft: #1B2745;
        --gold: #FFD23F;
        --gold-soft: #2E2610;
        --ok: #34D399;
        --ok-soft: #0F2E26;
        --warn: #FF8A3D;
        --sil: #1A2640;
        --m0: #2F3E60;
        --m1: #3F58B5;
        --m2: #6585F5;
        --m3: #A9C0FF;
        --m4: #FFD23F;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #080D1A;
      --surface: #11192B;
      --surface-2: #17223B;
      --ink: #EAF0FA;
      --muted: #8C9AB3;
      --line: #222F49;
      --accent: #5B80FF;
      --accent-d: #1B2F7A;
      --accent-ink: #080D1A;
      --soft: #1B2745;
      --gold: #FFD23F;
      --gold-soft: #2E2610;
      --ok: #34D399;
      --ok-soft: #0F2E26;
      --warn: #FF8A3D;
      --sil: #1A2640;
      --m0: #2F3E60;
      --m1: #3F58B5;
      --m2: #6585F5;
      --m3: #A9C0FF;
      --m4: #FFD23F;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 16px;
      line-height: 1.45;
      padding-block: calc(12px + env(safe-area-inset-top, 0px)) 160px;
      padding-left: max(14px, env(safe-area-inset-left, 0px));
      padding-right: max(14px, env(safe-area-inset-right, 0px));
    }

    .app {
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .brand {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .brand-badge {
      font: 600 .65rem var(--f-data);
      background: var(--soft);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: .05em
    }

    .top-r {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .status {
      font-size: .73rem;
      color: var(--muted)
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: .95rem
    }

    h2 {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 1.4rem;
      margin: 6px 0 0;
      text-transform: uppercase;
      letter-spacing: .03em
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .04)
    }

    .view {
      display: flex;
      flex-direction: column;
      gap: 13px;
      min-width: 0
    }

    /* Hero */
    .hero {
      background: linear-gradient(140deg, var(--accent), var(--accent-d));
      border: 0;
      color: #fff;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 26px solid rgba(255, 255, 255, .07);
      pointer-events: none
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .eyebrow {
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .85;
      font-weight: 600
    }

    .hero-title {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 3.1rem;
      line-height: .95;
      text-transform: uppercase
    }

    .hero-meta {
      opacity: .9;
      font-size: .86rem;
      margin-top: 4px
    }

    .prog-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(0, 0, 0, .18);
      padding: 9px 11px;
      border-radius: 12px
    }

    .prog-top {
      display: flex;
      justify-content: space-between;
      font: 600 .72rem var(--f-data);
      opacity: .95
    }

    .prog-bar {
      height: 6px;
      background: rgba(255, 255, 255, .2);
      border-radius: 99px;
      overflow: hidden
    }

    .prog-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width .3s ease
    }

    .week {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .wd {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font: 500 .66rem var(--f-data);
      opacity: .9
    }

    .dot {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      display: grid;
      place-items: center
    }

    .dot.today {
      border-color: #fff
    }

    .dot.on {
      background: #fff;
      border-color: #fff
    }

    .dot.on::after {
      content: "\2713";
      color: var(--accent-d);
      font-size: .75rem;
      font-weight: 800
    }

    .wk-txt {
      margin-left: auto;
      text-align: right;
      font-size: .7rem;
      line-height: 1.1;
      opacity: .92
    }

    .wk-txt b {
      display: block;
      font-family: var(--f-display);
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1
    }

    /* Quick daily bar (Creatine + Water) */
    .qbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .qpill {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      font: inherit;
      color: var(--ink)
    }

    .qpill.on {
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .qpill b {
      font-family: var(--f-display);
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: .03em
    }

    .qpill small {
      display: block;
      font: 500 .7rem var(--f-data);
      color: var(--muted)
    }

    /* Day selector chips */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none
    }

    .chips-row::-webkit-scrollbar {
      display: none
    }

    .day {
      flex: 1 0 auto;
      min-width: 82px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 12px;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      font: inherit;
      position: relative
    }

    .day small {
      display: block;
      color: var(--muted);
      font-size: .66rem;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .day b {
      font-family: var(--f-display);
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase
    }

    .day[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .day[aria-pressed="true"] small {
      color: inherit;
      opacity: .75
    }

    .day .nx {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold)
    }

    .day .dr {
      position: absolute;
      top: 8px;
      right: 20px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent)
    }

    /* Exercise Card */
    .ex {
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: border-color .25s, box-shadow .25s
    }

    .ex.done {
      border-color: var(--ok);
      box-shadow: inset 5px 0 0 var(--ok)
    }

    .ex-head {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .ico {
      flex: none;
      width: 82px;
      height: 66px;
      border-radius: 14px;
      background: var(--soft);
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent)
    }

    .ico canvas {
      width: 82px;
      height: 66px;
      display: block
    }

    .ex-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .ex-toprow {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px
    }

    .ex-name {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 1.38rem;
      line-height: 1.05;
      text-transform: uppercase;
      cursor: pointer
    }

    .ex-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 7px;
      align-items: center
    }

    .pill {
      font: 600 .74rem var(--f-data);
      background: var(--soft);
      color: var(--accent);
      border-radius: 99px;
      padding: 2px 8px
    }

    .pill.gold {
      background: var(--gold-soft);
      color: var(--gold)
    }

    .pill.muscle {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--line)
    }

    /* LAST LIFTED MEMORY BAR */
    .last-box {
      background: var(--surface-2);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .last-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .last-title {
      font: 600 .68rem var(--f-data);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .last-title b {
      color: var(--ink)
    }

    .last-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .lchip {
      font: 600 .74rem var(--f-data);
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
    }

    .lchip:active {
      transform: scale(.95)
    }

    .lchip:hover {
      border-color: var(--accent)
    }

    .lchip span {
      color: var(--muted);
      font-size: .66rem;
      margin-right: 3px
    }

    .lchip.top {
      border-color: var(--gold);
      background: var(--gold-soft)
    }

    .set-base-btn {
      font: 600 .7rem var(--f-data);
      background: var(--soft);
      color: var(--accent);
      border: 0;
      border-radius: 7px;
      padding: 4px 8px;
      cursor: pointer
    }

    /* Sets Grid */
    .sets {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .cols,
    .set {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 76px 42px;
      gap: 6px;
      align-items: center
    }

    .cols span {
      font: 600 .64rem var(--f-data);
      letter-spacing: .08em;
      color: var(--muted);
      text-align: center
    }

    .set {
      border-radius: 12px;
      padding: 3px;
      transition: background .2s
    }

    .set .n {
      font: 600 .8rem var(--f-data);
      color: var(--muted);
      text-align: center
    }

    .set.done {
      background: var(--soft)
    }

    .set.done .n {
      color: var(--accent)
    }

    input {
      font: 600 1rem var(--f-data);
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 6px;
      min-width: 0;
      width: 100%;
      text-align: center;
    }

    .set.done input {
      background: var(--surface);
      border-color: transparent
    }

    input[type="date"] {
      text-align: left;
      font-size: .95rem;
      padding: 9px 10px
    }

    input:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 24%, transparent)
    }

    /* Set memory & delta pill */
    .sinfo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0
    }

    .prev-btn {
      font: 600 .65rem var(--f-data);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 5px;
      cursor: pointer;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delta {
      font: 600 .63rem var(--f-data);
      padding: 1px 5px;
      border-radius: 5px;
      white-space: nowrap
    }

    .delta.up {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .delta.same {
      background: var(--surface-2);
      color: var(--muted)
    }

    .delta.rm {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline dotted
    }

    .chk {
      width: 42px;
      height: 40px;
      border-radius: 11px;
      border: 2px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .chk svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .set.done .chk {
      background: var(--accent);
      border-color: var(--accent)
    }

    .set.done .chk svg {
      stroke: var(--accent-ink)
    }

    /* Buttons & Utilities */
    .btn {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 14px;
      font: 700 1rem var(--f-body);
      padding: 14px 16px;
      cursor: pointer
    }

    .btn.ghost {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 600
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: .76rem;
      border-radius: 8px
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 600
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .fchips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    .fchips .btn {
      padding: 8px 12px;
      font-size: .86rem
    }

    /* Lists & Stats */
    .list {
      display: flex;
      flex-direction: column
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line)
    }

    .item:last-child {
      border-bottom: 0
    }

    .item .d {
      font-family: var(--f-data);
      color: var(--muted);
      font-size: .75rem
    }

    .item .v {
      font-family: var(--f-data);
      font-size: .82rem;
      text-align: right
    }

    .row-r {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .empty {
      color: var(--muted);
      font-size: .88rem
    }

    ul.rules {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    ul.rules li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: start;
      font-size: .92rem
    }

    ul.rules li::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin: 7px 0 0 5px
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px
    }

    .stat .k {
      color: var(--muted);
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 600
    }

    .stat .n {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 2rem;
      line-height: 1.05;
      margin-top: 2px
    }

    .stat .n small {
      font-size: .95rem;
      font-weight: 600;
      color: var(--muted);
      margin-left: 3px
    }

    /* Rings */
    .rings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .ringbox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 8px
    }

    .ringbox .wrap {
      position: relative;
      width: 120px;
      height: 120px
    }

    .ringbox svg {
      width: 120px;
      height: 120px;
      display: block
    }

    .rtrack {
      fill: none;
      stroke: var(--line);
      stroke-width: 10
    }

    .rprog {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 60px 60px;
      transition: stroke-dashoffset .8s ease
    }

    .rprog.gold {
      stroke: var(--gold)
    }

    .rprog.over {
      stroke: var(--warn)
    }

    .rc {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .rc b {
      font-family: var(--f-display);
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1
    }

    .rc small {
      font: 500 .68rem var(--f-data);
      color: var(--muted)
    }

    .rcap {
      font-size: .76rem;
      color: var(--muted);
      text-align: center
    }

    .rcap b {
      color: var(--ink)
    }

    /* Bottom Nav & Rest Timer */
    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      display: flex;

        var d = state.custom.days.filter(function (x) { return x.id === did; })[0];
        if (!d) return;
        save();
        modalOnClose = function () { save(); render(); };
        function paint() {
          var box = $("mbox"); box.textContent = "";
          var done = h("button", { class: "btn sm", type: "button", text: "Done" });
          done.onclick = closeModal;
          box.appendChild(h("div", { class: "mhead" }, [h("div", { class: "mtitle", text: "Edit Day" }), done]));
          var nameIn = h("input", { type: "text", value: d.name, style: "text-align:left" });
          nameIn.oninput = function () { d.name = nameIn.value; save(); };
          box.appendChild(h("label", {}, ["Day name", nameIn]));
          if (!d.ex.length) box.appendChild(h("div", { class: "empty", text: "No exercises yet. Add some from the library." }));
          d.ex.forEach(function (e, i) {
            var etc = h("canvas", { class: "thumb" }); thumbAnim(etc, e[0]);
            var sIn = h("input", { type: "text", inputmode: "numeric", value: String(e[1]) });
            sIn.oninput = function () { var n = parseInt(sIn.value, 10); if (n > 0) { e[1] = n; save(); } };
            var rIn = h("input", { type: "text", value: String(e[2]) });
            rIn.oninput = function () { if (rIn.value.trim()) { e[2] = rIn.value.trim(); save(); } };
            function mv(dir) {
              return function () {
                var j = i + dir; if (j < 0 || j >= d.ex.length) return;
                var t = d.ex[i]; d.ex[i] = d.ex[j]; d.ex[j] = t; save(); paint();
              };
            }
            var up = h("button", { class: "btn ghost sm", type: "button", text: "▲" }); up.onclick = mv(-1);
            var dn = h("button", { class: "btn ghost sm", type: "button", text: "▼" }); dn.onclick = mv(1);
            var rm = h("button", { class: "btn ghost sm", type: "button", text: "✕" });
            rm.onclick = function () { d.ex.splice(i, 1); save(); paint(); };
            box.appendChild(h("div", { class: "erow" }, [
              h("div", { style: "display:flex;align-items:center;gap:10px" }, [
                h("div", { class: "thumbbox" }, [etc]),
                h("div", { class: "en" }, [h("b", { text: e[0] }), h("small", { text: e[3] })])
              ]),
              h("div", { class: "eedit" }, [h("label", {}, ["Sets", sIn]), h("label", {}, ["Reps", rIn]), up, dn, rm])
            ]));
          });
          var add = h("button", { class: "btn", type: "button", text: "＋ Add exercises from library" });
          add.onclick = function () { openPicker(d, paint); };
          box.appendChild(add);
          $("modal").hidden = false;
        }
        paint();
      }

      function openPicker(d, back) {
        var box = $("mbox"); box.textContent = "";
        var group = "All", q = "";
        var done = h("button", { class: "btn sm", type: "button", text: "Done" });
        done.onclick = back;
        box.appendChild(h("div", { class: "mhead" }, [h("div", { class: "mtitle", text: "Exercise Library" }), done]));
        var search = h("input", { type: "text", placeholder: "Search exercises…", style: "text-align:left" });
        var chipRow = h("div", { class: "fchips" });
        var listEl = h("div", { class: "list" });
        box.appendChild(search); box.appendChild(chipRow); box.appendChild(listEl);
        function has(n) { return d.ex.some(function (e) { return e[0] === n; }); }
        function paintChips() {
          chipRow.textContent = "";
          ["All"].concat(GROUPS).forEach(function (g) {
            var b = h("button", { class: "btn sm" + (g === group ? "" : " ghost"), type: "button", text: g });
            b.onclick = function () { group = g; paintChips(); paintList(); };
            chipRow.appendChild(b);
          });
        }
        function paintList() {
          listEl.textContent = "";
          var items = allLib().filter(function (L) {
            return (group === "All" || L[1] === group) && (!q || L[0].toLowerCase().indexOf(q) > -1 || L[2].toLowerCase().indexOf(q) > -1);
          });
          if (!items.length) listEl.appendChild(h("div", { class: "empty", text: "No matches. Create your own below." }));
          items.forEach(function (L) {
            var on = has(L[0]);
            var tc = h("canvas", { class: "thumb" });
            var row = h("div", { class: "libitem" + (on ? " on" : "") }, [
              h("div", { class: "thumbbox" }, [tc]),
              h("div", { style: "flex:1;min-width:0" }, [h("b", { text: L[0] }), h("div", { class: "d", text: L[1] + " · " + L[2] + " · " + L[3] + "×" + L[4] })]),
              h("span", { class: "pill" + (on ? " gold" : ""), text: on ? "✓ Added" : "＋ Add" })
            ]);
            thumbAnim(tc, L[0]);
            row.onclick = function () {
              if (on) d.ex = d.ex.filter(function (e) { return e[0] !== L[0]; });
              else d.ex.push(exFromLib(L));
              save(); paintList();
            };
            listEl.appendChild(row);
          });
        }
        search.oninput = function () { q = search.value.trim().toLowerCase(); paintList(); };
        paintChips(); paintList();

        var nIn = h("input", { type: "text", placeholder: "Exercise name", style: "text-align:left" });
        var gSel = h("select", {}, GROUPS.map(function (g) { return h("option", { value: g, text: g }); }));
        var sIn = h("input", { type: "text", inputmode: "numeric", value: "3" });
        var rIn = h("input", { type: "text", value: "10" });
        var mk = h("button", { class: "btn ghost", type: "button", text: "＋ Create & add" });
        mk.onclick = function () {
          var name = nIn.value.trim();
          if (!name) { toast("Enter a name"); return; }
          var found = allLib().filter(function (L) { return L[0].toLowerCase() === name.toLowerCase(); })[0];
          if (found) {
            if (!has(found[0])) d.ex.push(exFromLib(found));
          } else {
            var L = [name, gSel.value, gSel.value, parseInt(sIn.value, 10) || 3, rIn.value.trim() || "10", 90, guessAnim(name, gSel.value)];
            state.customLib.push(L);
            d.ex.push(exFromLib(L));
          }
          nIn.value = ""; save(); paintList(); toast("Added " + name);
        };
        box.appendChild(h("h2", { text: "Your own exercise" }));
        box.appendChild(h("div", { style: "display:flex;flex-direction:column;gap:8px" }, [
          nIn,
          h("div", { class: "grid2" }, [h("label", {}, ["Muscle", gSel]), h("div", { class: "grid2" }, [h("label", {}, ["Sets", sIn]), h("label", {}, ["Reps", rIn])])]),
          mk
        ]));
        $("modal").hidden = false;
      }

      /* ---------- TRAINING SYSTEM SELECTOR ---------- */
      function renderPrograms(root) {
        root.appendChild(h("h2", { text: "Training System" }));
        var wrap = h("div", { style: "display:flex;flex-direction:column;gap:8px" });
        function card(id, name, freq, desc, days, onclick) {
          var active = state.programId === id;
          var b = h("button", { class: "prog" + (active ? " active" : ""), type: "button" }, [
            h("div", { class: "prog-top2" }, [h("b", { text: name }), h("span", { class: "pill" + (active ? " gold" : ""), text: active ? "Active · " + freq : freq })]),
            h("div", { class: "empty", text: desc }),
            days ? h("div", { style: "font-family:var(--f-data);font-size:.72rem;color:var(--muted)", text: days }) : null
          ]);
          b.onclick = onclick; return b;
        }
        PROGRAMS.forEach(function (p) {
          wrap.appendChild(card(p.id, p.name, p.freq, p.desc, p.days.map(function (x) { return x.name; }).join(" · "), function () { selectProgram(p.id); }));
        });
        if (state.custom) {
          wrap.appendChild(card("custom", state.custom.name, state.custom.days.length + " days", "Your own program. Days and exercises are fully editable.",
            state.custom.days.map(function (x) { return x.name; }).join(" · "), function () { selectProgram("custom"); }));
        }
        root.appendChild(wrap);

        var newBtn = h("button", { class: "btn ghost", type: "button", text: "＋ Build from scratch" });
        newBtn.onclick = function () {
          if (state.custom && !confirm("Replace your current “" + state.custom.name + "” with a blank program?")) return;
          createBlankCustom();
        };
        var copyBtn = h("button", { class: "btn ghost", type: "button", text: "⎘ Customize active" });
        copyBtn.onclick = function () {
          if (state.programId === "custom") { toast("You are already editing My Program"); return; }
          ensureCustom(); save(); render();
        };
        root.appendChild(h("div", { class: "grid2" }, [newBtn, copyBtn]));

        if (state.programId === "custom" && state.custom) {
          root.appendChild(h("h2", { text: "Edit My Program" }));
          var nameIn = h("input", { type: "text", value: state.custom.name, style: "text-align:left" });
          nameIn.oninput = function () { state.custom.name = nameIn.value || "My Program"; save(); };
          var list = h("div", { class: "list" });
          state.custom.days.forEach(function (d) {
            var ed = h("button", { class: "btn ghost sm", type: "button", text: "Edit" });
            ed.onclick = function () { openDayEditor(d.id); };
            var del = h("button", { class: "btn ghost sm", type: "button", text: "✕" });
            del.onclick = function () {
              if (state.custom.days.length < 2) { toast("Keep at least one day"); return; }
              if (!confirm("Delete " + d.name + "?")) return;
              state.custom.days = state.custom.days.filter(function (x) { return x.id !== d.id; });
              delete state.drafts[dk(d.id)];
              retag(); applyProgram();
              if (dayId === d.id) dayId = DAYS[0].id;
              save(); render();
            };
            list.appendChild(h("div", { class: "item" }, [
              h("div", {}, [h("div", { style: "font-weight:700", text: d.name }), h("div", { class: "d", text: d.tag + " · " + d.ex.length + " exercises" })]),
              h("div", { class: "row-r" }, [ed, del])
            ]));
          });
          var addDay = h("button", { class: "btn", type: "button", text: "＋ Add training day" });
          addDay.onclick = function () {
            var nd = NEW_DAY(state.custom.days.length + 1);
            state.custom.days.push(nd); retag(); applyProgram(); save(); render();
            openDayEditor(nd.id);
          };
          root.appendChild(h("div", { class: "card", style: "display:flex;flex-direction:column;gap:10px" }, [
            h("label", {}, ["Program name", nameIn]), list, addDay
          ]));
        }
      }

      /* ---------- TRAIN VIEW ---------- */
      function renderTrain(root) {
        var d = DAYS.filter(function (x) { return x.id === dayId; })[0];
        if (!d) { d = DAYS[0]; dayId = d.id; }
        var draft = state.drafts[dk(d.id)] || {};
        var totalSets = d.ex.reduce(function (a, e) { return a + e[1]; }, 0);
        var pct = 0;

        // Calculate live session completion
        var doneSets = 0, liveVol = 0;
        d.ex.forEach(function (e) {
          var arr = draft[e[0]] || [];
          arr.forEach(function (s) { if (s && s.done) { doneSets++; liveVol += (num(s.w) || 0) * (num(s.r) || 0); } });
        });

        pct = totalSets ? Math.round(doneSets / totalSets * 100) : 0;
        var volB = h("b", { text: "0" });
        var fillEl = h("div", { class: "prog-fill", style: "width:" + (lastPct.day === dayId ? lastPct.pct : 0) + "%" });
        var hero = h("section", { class: "card hero" }, [
          h("div", { class: "hero-row" }, [
            h("div", {}, [
              h("div", { class: "eyebrow", text: d.tag + " · " + d.ex.length + " Exercises" }),
              h("div", { class: "hero-title", text: d.name }),
              h("div", { class: "hero-meta", text: "Target: " + totalSets + " working sets" })
            ]),
            h("div", { class: "wk-txt" }, [volB, h("span", { text: "kg volume" })])
          ]),
          h("div", { class: "prog-wrap" }, [
            h("div", { class: "prog-top" }, [h("span", { text: "Session Progress" }), h("span", { text: doneSets + " / " + totalSets + " sets (" + pct + "%)" })]),
            h("div", { class: "prog-bar" }, [fillEl])
          ])
        ]);
        root.appendChild(hero);
        countUp(volB, lastPct.day === dayId ? lastPct.vol : 0, liveVol);
        requestAnimationFrame(function () { requestAnimationFrame(function () { fillEl.style.width = pct + "%"; }); });
        lastPct = { day: dayId, pct: pct, vol: liveVol };

        // Daily Creatine + Water Quick Strip
        var td = today(), hab = state.habits[td] || { creatine: false, water: 0 };
        var cBtn = h("button", { class: "qpill" + (hab.creatine ? " on" : ""), type: "button" }, [
          h("div", {}, [h("b", { text: "Creatine 5g" }), h("small", { text: hab.creatine ? "Taken today ✓" : "Tap to mark taken" })]),
          h("span", { text: hab.creatine ? "✅" : "⚡" })
        ]);
        cBtn.onclick = function () {
          hab.creatine = !hab.creatine; state.habits[td] = hab; save(); render();
        };
        var wBtn = h("button", { class: "qpill" + (hab.water >= 3.5 ? " on" : ""), type: "button" }, [
          h("div", {}, [h("b", { text: "Water: " + hab.water.toFixed(1) + " / 3.5L" }), h("small", { text: "Tap +0.5L cup" })]),
          h("span", { text: "💧" })
        ]);
        wBtn.onclick = function () {
          hab.water = Math.round(((hab.water || 0) + 0.5) * 10) / 10;
          if (hab.water > 5) hab.water = 0;
          state.habits[td] = hab; save(); render();
        };
        root.appendChild(h("div", { class: "qbar" }, [cBtn, wBtn]));

        // Day selector chips
        var nx = nextDay();
        var chips = h("div", { class: "chips-row" }, DAYS.map(function (x) {
          var hasDr = state.drafts[dk(x.id)] && Object.keys(state.drafts[dk(x.id)]).length > 0;
          var b = h("button", { class: "day", "aria-pressed": String(x.id === dayId) }, [
            h("small", { text: x.tag }),
            h("b", { text: x.name }),
            x.id === nx ? h("span", { class: "nx", title: "Up next" }) : null,
            hasDr ? h("span", { class: "dr", title: "Saved draft" }) : null
          ]);
          b.onclick = function () { dayId = x.id; fx.enter = true; render(); };
          return b;
        }));
        root.appendChild(chips);

        // Program name + customize / change system
        var editDayBtn = h("button", { class: "btn ghost", type: "button", text: "✎ Edit exercises" });
        editDayBtn.onclick = function () { openDayEditor(d.id); };
        var sysBtn = h("button", { class: "btn ghost", type: "button", text: "⇄ Change system" });
        sysBtn.onclick = function () { tab = "plan"; window.scrollTo(0, 0); fx.enter = true; render(); };
        root.appendChild(h("div", { class: "empty", style: "margin-bottom:-6px", text: "System: " + progName() }));
        root.appendChild(h("div", { class: "grid2" }, [editDayBtn, sysBtn]));

        var dateIn = h("input", { type: "date", value: today() });
        root.appendChild(h("label", {}, ["Session Date", dateIn]));

        if (!d.ex.length) {
          var addFirst = h("button", { class: "btn", type: "button", text: "＋ Add exercises to this day" });
          addFirst.onclick = function () { openDayEditor(d.id); };
          root.appendChild(h("div", { class: "card", style: "display:flex;flex-direction:column;gap:10px" }, [
            h("div", { class: "empty", text: "This day has no exercises yet. Pick them from the library." }), addFirst
          ]));
        }

        // Render Each Exercise Card with Quick "Last Weight" Memory
        d.ex.forEach(function (e) {
          var name = e[0], setsCount = e[1], repsTarget = e[2], muscle = e[3], restSec = e[4] || 90;
          var hist = getExerciseHistory(name);
          var lastSets = hist.sets;
          var exDraft = (draft[name] = draft[name] || []);

          var card = h("section", { class: "card ex" });
          var canvas = h("canvas", {});
          var icoBox = h("div", { class: "ico", title: "Tap for HD Form & Plate Calculator" }, [canvas]);
          drawBiomechanicalExercise(canvas, name, 1);
          icoBox.onclick = function () {
            var topW = hist.pr ? hist.pr[0] : 60;
            openPlateModal(name, topW, parseInt(repsTarget, 10) || 8);
          };

          // Top metadata + Fill all button
          var fillAllBtn = h("button", { class: "set-base-btn", text: lastSets.length ? "↺ Fill Last" : "＋ Set Last KG" });
          fillAllBtn.onclick = function () {
            if (!lastSets.length) { openBaselineModal(name); return; }
            for (var i = 0; i < setsCount; i++) {
              var ref = lastSets[i] || lastSets[lastSets.length - 1];
              exDraft[i] = exDraft[i] || { w: "", r: "", done: false };
              exDraft[i].w = String(ref[0]);
              exDraft[i].r = String(ref[1]);
            }
            state.drafts[dk(d.id)] = draft; save(); render();
            toast("Filled last weights for " + name);
          };

          var sub = h("div", { class: "ex-sub" }, [
            h("span", { class: "pill", text: setsCount + " × " + repsTarget }),
            h("span", { class: "pill muscle", text: muscle }),
            hist.pr ? h("span", { class: "pill gold", text: "PR: " + hist.pr[0] + "kg × " + hist.pr[1] }) : null
          ]);

          var head = h("div", { class: "ex-head" }, [
            icoBox,
            h("div", { class: "ex-meta" }, [
              h("div", { class: "ex-toprow" }, [
                h("div", { class: "ex-name", text: name, onclick: icoBox.onclick }),
                fillAllBtn
              ]),
              sub
            ])
          ]);
          card.appendChild(head);

          /* --- QUICK LAST LIFTED MEMORY STRIP --- */
          var lastBox = h("div", { class: "last-box" });
          if (lastSets.length) {
            var editBaseBtn = h("button", { class: "set-base-btn", style: "background:transparent;padding:0", text: "Edit Reference ✎" });
            editBaseBtn.onclick = function () { openBaselineModal(name); };
            lastBox.appendChild(h("div", { class: "last-hdr" }, [
              h("div", { class: "last-title", html: "⚡ LAST LIFTED (<b>" + hist.date + "</b>) — Tap any set to copy:" }),
              editBaseBtn
            ]));
            var chipWrap = h("div", { class: "last-chips" });
            lastSets.forEach(function (pair, idx) {
              var isTop = hist.pr && pair[0] === hist.pr[0] && pair[1] === hist.pr[1];
              var ch = h("button", { class: "lchip" + (isTop ? " top" : ""), type: "button" }, [
                h("span", { text: "S" + (idx + 1) }),
                pair[0] + "kg × " + pair[1]
              ]);
              ch.onclick = function () {
                var targetIdx = Math.min(idx, setsCount - 1);
                exDraft[targetIdx] = exDraft[targetIdx] || { w: "", r: "", done: false };
                exDraft[targetIdx].w = String(pair[0]);
                exDraft[targetIdx].r = String(pair[1]);
                state.drafts[dk(d.id)] = draft; save(); render();
                toast("Copied " + pair[0] + "kg × " + pair[1] + " to Set " + (targetIdx + 1));
              };
              chipWrap.appendChild(ch);
            });
            lastBox.appendChild(chipWrap);
          } else {
            var setNow = h("button", { class: "set-base-btn", text: "＋ Set Last Weight You Lifted" });
            setNow.onclick = function () { openBaselineModal(name); };
            lastBox.appendChild(h("div", { class: "last-hdr" }, [
              h("div", { class: "last-title", text: "No previous weight recorded yet" }),
              setNow
            ]));
          }
          card.appendChild(lastBox);

          /* --- SETS TABLE --- */
          var grid = h("div", { class: "sets" }, [
            h("div", { class: "cols" }, [
              h("span", { text: "#" }),
              h("span", { text: "KG" }),
              h("span", { text: "REPS" }),
              h("span", { text: "LAST / Δ" }),
              h("span", { text: "✓" })
            ])
          ]);

          for (var s = 0; s < setsCount; s++) {
            (function (s) {
              var curSet = exDraft[s] || (exDraft[s] = { w: "", r: "", done: false });
              var prevPair = lastSets[s] || lastSets[lastSets.length - 1] || null;

              var row = h("div", { class: "set" + (curSet.done ? " done" : "") + (fx.pop === name + ":" + s ? " flash" : "") });
              var wIn = h("input", { type: "text", inputmode: "decimal", value: curSet.w, placeholder: prevPair ? String(prevPair[0]) : "kg" });
              var rIn = h("input", { type: "text", inputmode: "numeric", value: curSet.r, placeholder: prevPair ? String(prevPair[1]) : repsTarget });
              var infoCell = h("div", { class: "sinfo" });

              function updateDelta() {
                infoCell.textContent = "";
                var cw = num(wIn.value), cr = num(rIn.value);
                if (prevPair) {
                  var pBtn = h("button", { class: "prev-btn", type: "button", title: "Tap to fill " + prevPair[0] + "kg × " + prevPair[1], text: "prev " + prevPair[0] + "×" + prevPair[1] });
                  pBtn.onclick = function () {
                    wIn.value = prevPair[0]; rIn.value = prevPair[1];
                    curSet.w = String(prevPair[0]); curSet.r = String(prevPair[1]);
                    state.drafts[dk(d.id)] = draft; save(); updateDelta();
                  };
                  infoCell.appendChild(pBtn);
                }
                if (cw !== null && cr !== null) {
                  if (prevPair) {
                    var dw = Math.round((cw - prevPair[0]) * 10) / 10;
                    var dr = cr - prevPair[1];
                    var txt = dw > 0 ? "+" + dw + "kg" : (dw === 0 && dr > 0 ? "+" + dr + " rep" : (dw === 0 && dr === 0 ? "= SAME" : dw + "kg"));
                    var cls = (dw > 0 || (dw === 0 && dr > 0)) ? "up" : "same";
                    infoCell.appendChild(h("span", { class: "delta " + cls, text: txt }));
                  } else {
                    var rm = Math.round(cw * (1 + cr / 30));
                    var rmSp = h("span", { class: "delta rm", text: "1RM " + rm });
                    rmSp.onclick = function () { openPlateModal(name, cw, cr); };
                    infoCell.appendChild(rmSp);
                  }
                }
              }
              updateDelta();

              wIn.oninput = function () { curSet.w = wIn.value; state.drafts[dk(d.id)] = draft; save(); updateDelta(); };
              rIn.oninput = function () { curSet.r = rIn.value; state.drafts[dk(d.id)] = draft; save(); updateDelta(); };

              var chk = h("button", { class: "chk" + (fx.pop === name + ":" + s ? " pop" : ""), type: "button", "aria-label": "Complete set" });
              chk.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
              chk.onclick = function () {
                if (curSet.done) {
                  curSet.done = false; state.drafts[dk(d.id)] = draft; save(); render(); return;
                }
                if (!wIn.value.trim() && prevPair) wIn.value = prevPair[0];
                if (!rIn.value.trim() && prevPair) rIn.value = prevPair[1];
                if (num(wIn.value) === null || num(rIn.value) === null) {
                  toast("Enter KG and Reps first"); return;
                }
                curSet.w = wIn.value; curSet.r = rIn.value; curSet.done = true;
                state.drafts[dk(d.id)] = draft; save();
                fx.pop = name + ":" + s;
                startRest(restSec, name);
                render();
              };

              row.appendChild(h("span", { class: "n", text: String(s + 1) }));
              row.appendChild(wIn);
              row.appendChild(rIn);
              row.appendChild(infoCell);
              row.appendChild(chk);
              grid.appendChild(row);

      function mbMaxBack() {
        var first = null;
        state.sessions.forEach(function (s) { var d = s && ymdOf(s.date); if (d && (!first || d < first)) first = d; });
        if (!first) return 0;
        var weeks = Math.round((ymdParse(weekStart(today())) - ymdParse(weekStart(first))) / (7 * 864e5));
        return Math.max(1, weeks);
      }

      function mbInsight(tot, hasSets, isNow) {
        if (!hasSets) return isNow ? "Nothing logged this week yet." : "No sessions logged that week.";
        var below = MUSCLE_ORDER.filter(function (m) { return !MUSCLE_MINOR[m] && tot[m] < 10; })
          .sort(function (a, b) { return (10 - tot[b]) - (10 - tot[a]); });
        var ok = MUSCLE_ORDER.filter(function (m) { return tot[m] >= 10 && tot[m] <= 20; });
        var over = MUSCLE_ORDER.filter(function (m) { return tot[m] > 20; });
        function nm(m) { return MUSCLE_INFO[m].short; }
        var parts = [];
        if (below.length) parts.push("Below target: " + below.slice(0, 2).map(function (m) { return nm(m) + " −" + mbFmt(10 - tot[m]); }).join(", ") + " sets" + (below.length > 2 ? " (+" + (below.length - 2) + " more)" : ""));
        if (ok.length) parts.push("On track: " + ok.slice(0, 3).map(nm).join(", ") + (ok.length > 3 ? " +" + (ok.length - 3) : ""));
        if (over.length) parts.push("High volume: " + over.slice(0, 2).map(nm).join(", "));
        if (!below.length && !over.length) parts = ["Every major muscle is on target — well balanced."];
        else if (!below.length && !ok.length) parts.unshift("Nothing below target");
        var dayIdx = (ymdParse(today()).getDay() + 1) % 7;
        return (isNow && dayIdx < 5 ? "So far: " : "") + parts.join(" · ");
      }

      function mbOpenModal(m, ws, stats) {
        var box = $("mbox"); box.textContent = "";
        var info = MUSCLE_INFO[m], v = stats.totals[m], lv = mbLevel(v), list = stats.contrib[m] || [];
        var closeB = h("button", { class: "btn ghost mclose", type: "button", text: "Close" });
        closeB.onclick = closeModal;
        box.appendChild(h("div", { class: "mhead" }, [h("div", { class: "mtitle", text: info.name }), closeB]));
        box.appendChild(h("div", { class: "msub" }, [
          h("i", { class: "lvbg lv" + lv }),
          h("span", { text: mbFmt(v) + " sets · " + MB_LEVELS[lv].name + " · " + mbShort(ws) + " – " + mbShort(ymdAdd(ws, 6)) })
        ]));
        if (!list.length) {
          box.appendChild(h("div", { class: "empty", text: "No sets counted for this muscle in this week." }));
          var tips = [];
          LIB.forEach(function (L) { var mm = MM_INDEX[mbNorm(L[0])]; if (mm && mm.p.indexOf(m) > -1 && tips.length < 4) tips.push(L[0]); });
          if (tips.length) box.appendChild(h("div", { class: "empty", text: "Exercises that train it directly: " + tips.join(", ") + "." }));
        }
        list.forEach(function (c) {
          var ses = c.sessions.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).map(function (s) {
            return h("div", { class: "d", text: mbDay(s.date) + " · " + s.dayName + " — " + s.sets + (s.sets === 1 ? " set" : " sets") });
          });
          box.appendChild(h("div", { class: "mex" }, [
            h("div", { class: "mex-top" }, [
              h("div", {}, [h("b", { text: c.ex }), h("span", { class: "pill" + (c.role === "primary" ? "" : " muscle"), text: c.role === "primary" ? "Primary ×1" : "Secondary ×0.5" })]),
              h("div", { class: "mex-pts" }, [h("b", { text: "+" + mbFmt(c.pts) }), h("small", { text: c.sets + (c.sets === 1 ? " set" : " sets") })])
            ])
          ].concat(ses)));
        });
        box.appendChild(h("div", { class: "mnote", text: "Counts saved sessions only, not a workout in progress. Primary sets count 1, secondary sets count 0.5." }));
        $("modal").hidden = false;
      }

      function renderMuscleCard(firstView) {
        var maxBack = mbMaxBack();
        if (mbOffset > maxBack) mbOffset = maxBack;
        if (mbOffset < 0) mbOffset = 0;
        var card = h("section", { class: "card mcard" });
        var prev = h("button", { class: "icon-btn mnav", type: "button", "aria-label": "Previous week", text: "‹" });
        var next = h("button", { class: "icon-btn mnav", type: "button", "aria-label": "Next week", text: "›" });
        var wkName = h("b"), wkRange = h("small"), wkTot = h("small");
        var insight = h("div", { class: "minsight", "aria-live": "polite" }), empty = h("div", { class: "mempty" });
        card.appendChild(h("div", { class: "mtitle2", text: "Muscle balance" }));
        card.appendChild(h("div", { class: "mwk" }, [prev, h("div", { class: "mwk-mid" }, [wkName, wkRange, wkTot]), next]));
        card.appendChild(insight);
        card.appendChild(empty);

        var paths = {}, stats = null, curWs = null, clrT = 0;
        function openM(m) { mbOpenModal(m, curWs, stats); }
        var fig = h("div", { class: "mfig" });
        ["front", "back"].forEach(function (view) {
          var holder = h("div", { class: "mbody" });
          holder.innerHTML = mbSvg(view);
          fig.appendChild(h("figure", {}, [holder, h("figcaption", { text: view })]));
          Array.prototype.forEach.call(holder.querySelectorAll("path[data-muscle]"), function (p) {
            var m = p.getAttribute("data-muscle");
            (paths[m] = paths[m] || []).push(p);
            p.onclick = function () { openM(m); };
            p.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openM(m); } };
          });
        });
        card.appendChild(fig);

        card.appendChild(h("div", { class: "mleg" }, MB_LEVELS.map(function (L, i) {
          return h("span", {}, [h("i", { class: "lvbg lv" + i }), L.range + " · " + L.name]);
        })));

        var barsWrap = h("div", { class: "mbars" }), rows = {};
        MUSCLE_ORDER.forEach(function (m) {
          var band = h("span", { class: "mband" }), fill = h("span", { class: "mfill lv0" });
          var vB = h("b", { text: "0" }), vS = h("small", { text: "none" });
          var row = h("button", { class: "mrow", type: "button" }, [
            h("span", { class: "mname", text: MUSCLE_INFO[m].name }),
            h("span", { class: "mtrack" }, [band, fill]),
            h("span", { class: "mval" }, [vB, vS])
          ]);
          row.onclick = function () { openM(m); };
          rows[m] = { row: row, band: band, fill: fill, vB: vB, vS: vS };
          barsWrap.appendChild(row);
        });
        card.appendChild(barsWrap);
        var note = h("div", { class: "mnote", text: "Dashed band = 10–20 sets per week. Primary sets count 1, secondary sets 0.5. Tap a muscle for the exercises behind it." });
        card.appendChild(note);

        // blank = draw labels but keep colours/bars empty (so they can animate in)
        function paint(animate, blank) {
          curWs = ymdAdd(weekStart(today()), -7 * mbOffset);
          var we = ymdAdd(curWs, 6);
          stats = weekStats(curWs, state.sessions);
          var tot = stats.totals, anyEver = state.sessions.length > 0;
          var nSets = setCount([curWs, we], state.sessions);
          wkName.textContent = mbOffset === 0 ? "This week" : mbOffset === 1 ? "Last week" : mbOffset + " weeks ago";
          wkRange.textContent = mbShort(curWs) + " – " + mbShort(we);
          wkTot.textContent = nSets ? nSets + " sets · " + Math.round(totalVolume([curWs, we], state.sessions)).toLocaleString() + " kg" : "No sets logged";
          prev.disabled = mbOffset >= maxBack; next.disabled = mbOffset <= 0;
          if (!anyEver) {
            insight.hidden = true; empty.hidden = false; barsWrap.hidden = true; note.hidden = true;
            empty.textContent = "No sessions yet. Finish a workout on the Train tab and the muscles you hit will light up here.";
          } else {
            empty.hidden = true; insight.hidden = false; barsWrap.hidden = false; note.hidden = false;
            insight.textContent = mbInsight(tot, nSets > 0, mbOffset === 0);
          }
          var mx = 0; MUSCLE_ORDER.forEach(function (m) { if (tot[m] > mx) mx = tot[m]; });
          var scale = Math.max(24, Math.ceil(mx / 4) * 4);
          var rank = MUSCLE_ORDER.slice().sort(function (a, b) { return tot[b] - tot[a] || MUSCLE_ORDER.indexOf(a) - MUSCLE_ORDER.indexOf(b); });
          var useDelay = !!animate && !REDUCED;
          clearTimeout(clrT);
          MUSCLE_ORDER.forEach(function (m, i) {
            var v = tot[m], lv = mbLevel(v), shown = blank ? 0 : lv, dl = useDelay ? (i * 42) + "ms" : "0ms";
            var label = MUSCLE_INFO[m].name + ": " + mbFmt(v) + " sets, " + MB_LEVELS[lv].name;
            (paths[m] || []).forEach(function (p) {
              p.style.transitionDelay = dl;
              p.setAttribute("class", "mpath lv" + shown);
              p.setAttribute("aria-label", label + ". Tap for details");
              var t = p.querySelector("title"); if (t) t.textContent = label;
            });
            var r = rows[m];
            r.row.style.order = String(rank.indexOf(m));
            r.row.setAttribute("aria-label", label + ". Tap for details");
            r.band.style.left = (10 / scale * 100) + "%"; r.band.style.width = (10 / scale * 100) + "%";
            r.fill.style.transitionDelay = dl;
            r.fill.className = "mfill lv" + shown;
            r.fill.style.width = (blank || v <= 0) ? "0%" : Math.max(3, Math.min(100, v / scale * 100)) + "%";
            r.vB.textContent = mbFmt(v); r.vS.textContent = MB_LEVELS[lv].name;
          });
          if (useDelay) clrT = setTimeout(function () {
            MUSCLE_ORDER.forEach(function (m) {
              (paths[m] || []).forEach(function (p) { p.style.transitionDelay = ""; });
              rows[m].fill.style.transitionDelay = "";
            });
          }, MUSCLE_ORDER.length * 42 + 900);
        }
        prev.onclick = function () { if (mbOffset < maxBack) { mbOffset++; paint(true); } };
        next.onclick = function () { if (mbOffset > 0) { mbOffset--; paint(true); } };

        if (firstView) { paint(false, true); setTimeout(function () { paint(true); }, 240); }
        else paint(false);
        return card;
      }

      /* ---------- BODY VIEW ---------- */
      function renderBody(root) {
        root.appendChild(renderMuscleCard(!!fx.enter));
        var sorted = state.body.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
        var withKg = sorted.filter(function (b) { return b.kg != null; });
        var cur = withKg[withKg.length - 1], first = withKg[0];
        var diff = cur && first ? Math.round((cur.kg - first.kg) * 10) / 10 : 0;
        var toGoal = cur ? Math.round((cur.kg - GOAL_KG) * 10) / 10 : 0;

        function tile(k, n, u) {
          var big = h("div", { class: "n", text: n }); if (u) big.appendChild(h("small", { text: u }));
          return h("div", { class: "stat" }, [h("div", { class: "k", text: k }), big]);
        }
        root.appendChild(h("div", { class: "grid2" }, [
          tile("Current Weight", cur ? String(cur.kg) : "–", "kg"),
          tile("Target Goal", String(GOAL_KG), "kg"),
          tile("Total Change", (diff > 0 ? "+" : "") + diff, "kg"),
          tile("To Goal", toGoal > 0 ? toGoal + " left" : "Reached!", "kg")
        ]));

        root.appendChild(h("h2", { text: "Log Check-in" }));
        var f = {
          date: h("input", { type: "date", value: today() }),
          kg: h("input", { type: "text", inputmode: "decimal", placeholder: "e.g. 88.5" }),
          waist: h("input", { type: "text", inputmode: "decimal", placeholder: "cm" })
        };
        var add = h("button", { class: "btn", text: "Save Weight Entry" });
        add.onclick = function () {
          var kg = num(f.kg.value), w = num(f.waist.value);
          if (kg === null && w === null) { toast("Enter weight or waist"); return; }
          state.body.push({ date: f.date.value || today(), kg: kg, waist: w, fat: null, note: "" });
          save(); toast("Weight logged"); render();
        };
        root.appendChild(h("div", { class: "card", style: "display:flex;flex-direction:column;gap:10px" }, [
          h("label", {}, ["Date", f.date]),
          h("div", { class: "grid2" }, [h("label", {}, ["Weight (kg)", f.kg]), h("label", {}, ["Waist (cm)", f.waist])]),
          add
        ]));

        root.appendChild(h("h2", { text: "History" }));
        var list = h("div", { class: "card list" });
        sorted.slice().reverse().forEach(function (b) {
          var parts = []; if (b.kg != null) parts.push(b.kg + " kg"); if (b.waist != null) parts.push(b.waist + " cm"); if (b.fat != null) parts.push(b.fat + "% fat");
          var del = h("button", { class: "btn ghost sm", text: "Remove" });
          del.onclick = function () { var i = state.body.indexOf(b); if (i > -1) state.body.splice(i, 1); save(); render(); };
          list.appendChild(h("div", { class: "item" }, [
            h("div", {}, [h("div", { text: b.note || "Check-in" }), h("div", { class: "d", text: b.date })]),
            h("div", { class: "row-r" }, [h("div", { class: "v", text: parts.join(" · ") }), del])
          ]));
        });
        root.appendChild(list);
      }

      /* ---------- MEALS VIEW ---------- */
      function ring(label, val, target, unit, cls) {
        var C = 2 * Math.PI * 46, over = val > target, frac = Math.min(1, val / target);
        var box = h("div", { class: "ringbox" }), wrap = h("div", { class: "wrap" });
        wrap.innerHTML = '<svg viewBox="0 0 120 120"><circle class="rtrack" cx="60" cy="60" r="46"/><circle class="rprog' + (cls ? " " + cls : "") + (over ? " over" : "") + '" cx="60" cy="60" r="46" style="stroke-dasharray:' + C + ';stroke-dashoffset:' + (C * (1 - frac)) + '"/></svg>';
        wrap.appendChild(h("div", { class: "rc" }, [h("b", { text: String(Math.round(val)) }), h("small", { text: unit })]));
        var left = Math.round(target - val);
        box.appendChild(wrap);
        box.appendChild(h("div", { class: "rcap" }, [h("b", { text: label }), h("br"), over ? (-left) + " over " + target : left + " left of " + target]));
        return box;
      }

      function renderMeals(root) {
        var dateIn = h("input", { type: "date", value: foodDate });
        dateIn.onchange = function () { foodDate = dateIn.value || today(); render(); };
        var rows = state.food.filter(function (f) { return f.date === foodDate; }), kc = 0, pr = 0;
        rows.forEach(function (f) { kc += f.kcal; pr += f.p; });

        root.appendChild(h("label", {}, ["Date", dateIn]));
        root.appendChild(h("div", { class: "rings" }, [
          ring("Calories", kc, KCAL, "kcal", ""),
          ring("Protein", pr, PRO, "g", "gold")
        ]));

        root.appendChild(h("h2", { text: "Quick Add Meals & High-Protein Staples" }));
        var chips = h("div", { class: "fchips" });
        MEALS.concat(QUICK_FOODS).forEach(function (m) {
          var b = h("button", { class: "btn ghost", text: "+ " + m.name + " (" + m.p + "g P)" });
          b.onclick = function () {
            state.food.push({ id: uid(), date: foodDate, name: m.name, kcal: m.kcal, p: m.p });
            save(); toast(m.name + " added"); render();
          };
          chips.appendChild(b);
        });
        root.appendChild(chips);

        var f = {
          name: h("input", { type: "text", placeholder: "Food name", style: "text-align:left" }),
          kcal: h("input", { type: "text", inputmode: "numeric", placeholder: "kcal" }),
          pro: h("input", { type: "text", inputmode: "decimal", placeholder: "g" })
        };
        var add = h("button", { class: "btn", text: "Add Custom Food" });
        add.onclick = function () {
          var k = num(f.kcal.value), p = num(f.pro.value);
          if (k === null || k <= 0) { toast("Enter calories"); return; }
          state.food.push({ id: uid(), date: foodDate, name: f.name.value.trim() || "Food", kcal: Math.round(k), p: p || 0 });
          save(); toast("Added"); render();
        };
        root.appendChild(h("div", { class: "card", style: "display:flex;flex-direction:column;gap:10px" }, [
          h("label", {}, ["Food", f.name]),
          h("div", { class: "grid2" }, [h("label", {}, ["Calories", f.kcal]), h("label", {}, ["Protein (g)", f.pro])]),
          add
        ]));

        var list = h("div", { class: "card list" });
        if (!rows.length) list.appendChild(h("div", { class: "empty", text: "Nothing logged today yet." }));
        rows.forEach(function (r) {
          var del = h("button", { class: "btn ghost sm", text: "Remove" });
          del.onclick = function () { state.food = state.food.filter(function (x) { return x.id !== r.id; }); save(); render(); };
          list.appendChild(h("div", { class: "item" }, [
            h("div", { text: r.name }),
            h("div", { class: "row-r" }, [h("div", { class: "v", text: r.kcal + " kcal · " + r.p + "g P" }), del])
          ]));
        });
        root.appendChild(list);
      }

      /* ---------- PLAN & BACKUP VIEW ---------- */
      function renderPlan(root) {
        function tile(k, n, u) {
          var big = h("div", { class: "n", text: n }); if (u) big.appendChild(h("small", { text: u }));
          return h("div", { class: "stat" }, [h("div", { class: "k", text: k }), big]);
        }
        renderPrograms(root);
        root.appendChild(h("div", { class: "grid2" }, [
          tile("Calories", "2500–2600", "kcal"),
          tile("Protein", "160–180", "g"),
          tile("Goal Weight", "81.0", "kg"),
          tile("InBody Start", "90.6", "kg")
        ]));

        root.appendChild(h("h2", { text: "Alerts & Screen" }));
        function toggleRow(title, sub, on) {
          var sw = h("span", { class: "sw" + (on ? " on" : "") });
          var b = h("button", { class: "qpill" + (on ? " on" : ""), type: "button" }, [h("div", {}, [h("b", { text: title }), h("small", { text: sub })]), sw]);
          b.setOn = function (v) { b.classList.toggle("on", v); sw.classList.toggle("on", v); };
          return b;
        }
        var nBtn = toggleRow("Rest-end alert", "Notification + sound when rest finishes", !!state.notify && notifyOK());
        nBtn.onclick = function () {
          if (state.notify) { state.notify = false; save(); nBtn.setOn(false); toast("Rest alerts off"); return; }
          if (!("Notification" in window)) { toast("iPhone: add the app to Home Screen first, then enable", 3600); return; }
          var handled = false;
          function done(perm) {
            if (handled) return; handled = true;
            if (perm === "granted") {
              state.notify = true; save(); nBtn.setOn(true);
              showNotif("Gym Log", "Rest alerts are on ✓");
            } else {
              nBtn.setOn(false); toast("Blocked — allow it in iPhone Settings → Notifications", 3600);
            }
          }
          try { var r = Notification.requestPermission(done); if (r && r.then) r.then(done); } catch (e) { done("denied"); }
        };
        var awakeOK = !!navigator.wakeLock;
        var wBtn2 = toggleRow("Keep screen on while resting", awakeOK ? "Stops the phone locking during the rest timer" : "Not supported on this device", awakeOK && state.keepAwake);
        wBtn2.onclick = function () {
          if (!awakeOK) { toast("Not supported on this device"); return; }
          state.keepAwake = !state.keepAwake; save(); wBtn2.setOn(state.keepAwake);
          if (!state.keepAwake) freeScreen();
        };
        root.appendChild(h("div", { style: "display:flex;flex-direction:column;gap:8px" }, [nBtn, wBtn2,
          h("div", { class: "note", text: "On iPhone the alert arrives while the app is open or just backgrounded. Keeping the screen on during rest is the most reliable way to hear the beep." })]));

        root.appendChild(h("h2", { text: "Backup & Restore (Keep Your Data Safe)" }));
        var expBtn = h("button", { class: "btn", text: "⬇ Export Backup (JSON)" });
        expBtn.onclick = function () {
          var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "gymlog-backup-" + today() + ".json";
          a.click();
        };
        var fileIn = h("input", { type: "file", accept: ".json", style: "display:none" });
        var impBtn = h("button", { class: "btn ghost", text: "⬆ Import Backup (JSON)" });
        impBtn.onclick = function () { fileIn.click(); };
        fileIn.onchange = function (e) {
          var file = e.target.files && e.target.files[0]; if (!file) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            try {
              var parsed = JSON.parse(ev.target.result);
              if (parsed && Array.isArray(parsed.sessions)) {
                state = Object.assign(fresh(), parsed); save(); render(); toast("Backup restored!");
              }
            } catch (err) { toast("Invalid backup file"); }
          };
          reader.readAsText(file);
        };
        root.appendChild(h("div", { class: "card grid2" }, [expBtn, impBtn, fileIn]));

        root.appendChild(h("h2", { text: "Progression Rules" }));
        var ul = h("ul", { class: "rules" });
        [
          "Stop each set 1–2 reps before failure.",
          "When you hit the top of the rep range on every set, add 2.5 kg next session.",
          "Aim to lose 0.3–0.5 kg per week toward your 81.0 kg goal.",
          "InBody Baseline (5 Oct 2026): 90.6 kg weight · 37.3 kg muscle · 25.2% body fat."
        ].forEach(function (t) { ul.appendChild(h("li", { text: t })); });
        root.appendChild(h("div", { class: "card" }, [ul]));
      }

      /* ---------- RENDER SHELL ---------- */
      function render() {
        clearAnimLoops();
        ["train", "body", "meals", "plan"].forEach(function (t) {
          $("t-" + t).setAttribute("aria-selected", String(t === tab));
        });
        var root = $("view"); root.textContent = "";
        if (tab === "train") renderTrain(root);
        else if (tab === "body") renderBody(root);
        else if (tab === "meals") renderMeals(root);
        else renderPlan(root);
        if (fx.enter && !REDUCED) {
          root.classList.add("enter");
          for (var i = 0; i < root.children.length; i++)root.children[i].style.setProperty("--i", String(Math.min(i, 10)));
          clearTimeout(render._t); render._t = setTimeout(function () { root.classList.remove("enter"); }, 1200);
        } else root.classList.remove("enter");
        fx.enter = false; fx.pop = null;
      }

      ["train", "body", "meals", "plan"].forEach(function (t) {
        $("t-" + t).onclick = function () { tab = t; window.scrollTo(0, 0); fx.enter = true; render(); };
      });

      load();
      fx.enter = true;
      render();
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
    }
  </script>
</body>

</html>
